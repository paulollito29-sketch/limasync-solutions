<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- LimaSync Isotipo Icon (100x100) -->
  <!-- Base circle: Dark ink #111110 -->
  <circle cx="50" cy="50" r="41" stroke="#111110" stroke-width="8.5" />
  <!-- Cyan arc: #0ea5e9 covering 270 degrees with 35deg rotation -->
  <circle cx="50" cy="50" r="41" stroke="#0ea5e9" stroke-width="8.5"
          stroke-dasharray="193.21 64.40"
          transform="rotate(35 50 50)" />
</svg>
