<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Base circle: Dark ink #16150f -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#16150f" stroke-width="8.5" />
  <!-- Cyan arc #0ea5e9 covering 270 degrees with 35deg rotation (matching .logo-mark CSS) -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#0ea5e9" stroke-width="8.5"
          stroke-dasharray="193.21 64.40"
          transform="rotate(35 50 50)" />
</svg>
